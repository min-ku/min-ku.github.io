- slug: panda-pick-and-stack
  title: Vision-Aided Pick-and-Stack with a 7-DOF Manipulator
  area: Robot Manipulation
  featured: true
  poster: /assets/img/teasers/manipulator.jpg
  video: /videos/manipulator.mp4
  short_summary: >-
    AprilTag perception, gradient-based inverse kinematics, and collision-aware waypoint planning for a Franka Panda.
  summary: >-
    This project uses real-time AprilTag feedback and gradient-based inverse kinematics
    to pick and stack blocks with a 7-DOF Franka Emika Panda. Collision-aware waypoint
    trajectories support both static and moving-block manipulation tasks.
