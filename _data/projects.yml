- slug: footstep-controller-comparison
  title: Comparative Analysis of MPC, LQR, and RL Footstep Planners on Uneven Terrain
  area: Legged Locomotion
  featured: true
  poster: /assets/img/teasers/controller-comparison.jpg
  animated_image: /images/eval.gif
  short_summary: >-
    A Drake-based comparison of model-predictive, LQR, and reinforcement-learning footstep planners for Cassie.
  summary: >-
    This project compares model-predictive control, linear-quadratic regulation, and
    reinforcement-learning footstep planners for bipedal locomotion. Velocity tracking
    and success rates are evaluated across varied initial conditions and uneven terrain
    in a Drake simulation of Cassie.
  links: []

- slug: obstacle-estimation
  title: Optimization-Based Obstacle Estimation from Human Demonstrations
  area: Optimization and Control
  featured: true
  poster: /assets/img/teasers/obstacle-estimation.jpg
  video: /videos/obstacle.mp4
  short_summary: >-
    Learning obstacle geometry from expert demonstrations through CLF-CBF constraints and probabilistic regression.
  summary: >-
    This project learns obstacle position and size from expert demonstrations using
    control-Lyapunov and control-barrier-function constraints. Gaussian mixture models
    and regression provide a probabilistic estimate without requiring direct obstacle sensing.
  links:
    - label: Paper
      url: /files/Optimization_paper.pdf
    - label: Poster
