- slug: go2-cbf-obstacle-avoidance
  title: Obstacle Avoidance Using Control Barrier Functions
  area: Quadruped Control
  featured: true
  poster: /assets/img/teasers/cbf.jpg
  video: /videos/cbf.mp4
  short_summary: >-
    Using control barrier functions.
  summary: >-
    This project applies control barrier functions to obstacle identification and
    avoidance on a Unitree Go2 quadruped. AprilTags provide obstacle observations and
    a safety filter modifies the robot's motion to maintain collision-free behavior.
